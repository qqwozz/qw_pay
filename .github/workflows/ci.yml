name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v -race -count=1 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  security:
    name: Security
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Download dependencies
        run: go mod download

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: CGO_ENABLED=0 go build -o server ./cmd/server

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: server
          path: server

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version
        id: version
        run: |
          TAG="v1.0.${{ github.run_number }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: server
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: |
            ## QW Pay ${{ steps.version.outputs.tag }}

            ### Features
            - Real-time exchange rates via Frankfurter API
            - User registration with OTP verification
            - JWT authentication with refresh tokens
            - Multi-currency account management (RUB/USD/EUR)
            - Real-time transactions with idempotency
            - Cross-currency transfers with live rates
            - Anti-fraud system integration (C++ + Python via Redis)
            - Daily transfer limits and max transfer amount
            - Optimistic locking for concurrent transactions
            - Graceful shutdown with health check endpoint

            ### Security
            - OTP: constant-time comparison (timing attack protection)
            - JWT: signing method validation (alg:none prevention)
            - Balance check before debit (insufficient funds)
            - Parameterized SQL queries (injection prevention)
            - Rate limiting on auth endpoints

            ### Tech Stack
            - Go 1.23 with Gin framework
            - PostgreSQL 16 with pgx driver
            - Redis 7 for anti-fraud queues
            - Frankfurter API for real-time exchange rates
            - Docker + Docker Compose
            - GitHub Actions CI/CD with govulncheck
          files: dist/server
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
